<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>入出構受付</title>
  <style>
    body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #444; margin-bottom: 20px; }
    label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; background-color: white; }
    
    .no-input { background-color: #fffde7; border: 2px solid #fbc02d; font-weight: bold; text-align: center; letter-spacing: 2px; font-size: 20px; appearance: auto; cursor: pointer; }

    button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 25px; }
    .btn-entry { background-color: #007bff; color: white; }
    .btn-exit { background-color: #dc3545; color: white; padding: 25px; font-size: 22px; }
    .hidden { display: none !important; }
    #loader { text-align: center; padding: 20px; }
    #error-display { color: red; text-align: center; margin-top: 20px; font-weight: bold; font-size: 14px; display: none; }
    .note { font-size: 0.9em; color: #666; margin-bottom: 15px; background: #eee; padding: 10px; border-radius: 4px; }
    .mode-switch { text-align: center; margin-top: 20px; font-size: 14px; }
    .mode-switch a { color: #007bff; text-decoration: none; border-bottom: 1px dashed #007bff; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-box { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transform: scale(0.9); transition: transform 0.2s; }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; }
    .modal-msg { font-size: 16px; margin-bottom: 25px; color: #555; line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .btn-modal { padding: 12px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 48%; margin-top: 0; }
    .btn-cancel { background: #e0e0e0; color: #333; }
    .btn-confirm { background: #dc3545; color: white; box-shadow: 0 4px 6px rgba(220,53,69,0.3); }

    .color-1 { color: #28a745; } 
    .color-2 { color: #ffc107; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); } 
    .color-3 { color: #007bff; } 

    /* 同行者入力フォーム用スタイル */
    .companion-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .companion-row input {
      flex: 1;
    }
    .btn-remove-companion {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 12px 15px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: auto;
      margin-top: 0;
      transition: background-color 0.2s;
    }
    .btn-remove-companion:hover {
      background-color: #c82333;
    }
    .btn-add-companion {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: auto;
      margin-top: 5px;
      margin-bottom: 15px;
      transition: background-color 0.2s;
      display: inline-block;
    }
    .btn-add-companion:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loader">
      <p>読み込み中...</p>
      <div id="error-display"></div>
    </div>

    <div id="entrySection" class="hidden">
      <div style="position: relative; margin-bottom: 20px; min-height: 40px; display: flex; align-items: center; justify-content: center;">
        <span id="gateDisplayBadge" style="position: absolute; left: 0; background:#007bff; color:white; font-size:14px; font-weight:bold; padding:5px 12px; border-radius:20px;">ゲート１</span>
        <h2 style="margin:0; text-align:center;">👋 入構受付</h2>
      </div>
      <p class="note">必要事項を入力し、守衛室で入構証を受け取ってください。</p>
      <form id="entryForm">
        <label>会社名</label>
        <input type="text" name="company" placeholder="例：〇〇運送" required>
        
        <label>代表者 氏名</label>
        <input type="text" name="name" placeholder="例：配送 太郎" required>
        
        <div id="companionSection">
          <label>同行者 氏名</label>
          <div id="companionList">
            <!-- ここに動的に同行者入力欄が追加される -->
          </div>
          <button type="button" class="btn-add-companion" onclick="addCompanionInput()">+ 同行者を追加</button>
        </div>
        
        <label>電話番号</label>
        <input type="tel" name="tel" placeholder="09012345678" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
        
        <label>用件</label>
        <select name="purpose">
          <option value="納品・集荷">納品・集荷</option>
          <option value="工事・作業">工事・作業</option>
          <option value="打ち合わせ">打ち合わせ</option>
          <option value="その他">その他</option>
        </select>

        <label>面会先</label>
        <select name="contact" required>
          <option value="" disabled selected>選択してください</option>
          <option value="（株）上組">１．（株）上組</option>
          <option value="五島海運（株）">２．五島海運（株）</option>
          <option value="アース電機（株）">３．アース電機（株）</option>
          <option value="タカノ（株）">４．タカノ（株）</option>
          <option value="カーレポ（株）">５．カーレポ（株）</option>
          <option value="メルセデス・ベンツ日本（同）">６．メルセデス・ベンツ日本（同）</option>
          <option value="エムビー・サービス日本（株）">７．エムビー・サービス日本（株）</option>
          <option value="Stellantisジャパン（株）">８．Stellantisジャパン（株）</option>
          <option value="その他">９．その他</option>
        </select>

        <button type="button" class="btn-entry" onclick="submitEntry()">入構登録</button>
      </form>
      <div class="mode-switch"><a href="#" onclick="showExitSearch(); return false;">出構の方はこちら (No選択)</a></div>
    </div>

    <div id="exitSearchSection" class="hidden">
      <h2>🏁 出構申請</h2>
      <p class="note">手元の入構証番号を選択してください。</p>
      <label>入構証No.</label>
      <select id="searchNo" class="no-input">
        <option value="" disabled selected>番号を選択</option>
      </select>
      <button type="button" class="btn-exit" onclick="manualSearch()">確認する</button>
      <div class="mode-switch"><a href="#" onclick="showEntry(); return false;">← 入構受付に戻る</a></div>
    </div>

    <div id="exitSection" class="hidden" style="text-align:center;">
      <h2>🏁 出構申請</h2>
      <div style="margin: 20px 0;">
        <p>以下の番号で申請します</p>
        <h1 style="font-size: 48px; margin: 10px 0;">No.<span id="exitNoDisplay"></span></h1>
      </div>
      <button type="button" class="btn-exit" onclick="submitExit()">出構申請をする</button>
      <p style="font-size:12px; color:#666;">※入構証を守衛所へ返却してください</p>
    </div>

    <div id="completeSection" class="hidden" style="text-align:center;">
      <h2 style="color:#28a745;">✅ 送信完了</h2>
      <p id="completeMsg">守衛室で入構証を受け取ってください。</p>
      <br>
    </div>
  </div>

  <div id="customModal" class="modal-overlay">
    <div class="modal-box">
      <div id="modalTitle" class="modal-title">確認</div>
      <div id="modalMsg" class="modal-msg">メッセージ</div>
      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeModal()">キャンセル</button>
        <button id="modalConfirmBtn" class="btn-modal btn-confirm">実行</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // ★重要: ここにGAS（バックエンドAPI）のURLを貼り付けてください
    // =========================================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxtllAMp567xS0HvxTZRHUC2cbupW9NOV7-P4Y9V3sy1iOaILPqUH-RaS6eTnTNC3uO6w/exec";

    let initialMode = "entry";
    let initialNo = "";
    let currentGate = "800";
    
    /**
     * 入構証番号（800〜1030）から対象のGATE番号を自動算出する。
     * 
     * @param {string|number} noStr - 入構証番号
     * @return {string|null} GATE番号（"800", "900", "1000" または null）
     */
    function getGateFromNo(noStr) {
      const num = parseInt(noStr, 10);
      if (num >= 800 && num <= 830) return "800";
      if (num >= 900 && num <= 930) return "900";
      if (num >= 1000 && num <= 1030) return "1000";
      return null;
    }

    /**
     * GATEの内部表記（800, 900, 1000）をユーザー表示用名称（ゲート１, ゲート２, ゲート３）に変換する。
     * 
     * @param {string} gateVal - 内部GATE値
     * @return {string} 表示用ゲート名
     */
    function getGateLabel(gateVal) {
      const g = String(gateVal || "800").trim();
      if (g === "900") return "ゲート２";
      if (g === "1000") return "ゲート３";
      if (g === "800") return "ゲート１";
      return "ゲート " + g;
    }

    /**
     * 画面上のGATE表示バッジテキストを更新し、送信用currentGate変数を設定する。
     * 
     * @param {string} gateVal - 設定するGATE番号
     */
    function updateGateDisplay(gateVal) {
      if (!gateVal) return;
      currentGate = String(gateVal).trim();
      const badgeEl = document.getElementById('gateDisplayBadge');
      if (badgeEl) {
        badgeEl.innerText = getGateLabel(currentGate);
      }
    }

    let lastFailedAction = null;

    /**
     * GASのWeb API（doPost）に対してFetch APIを用いて非同期HTTPリクエストを送信する。
     * CORS通信のエラーを回避するため、リクエストヘッダーに「Content-Type: text/plain」を指定して送信する。
     * 一時的な通信障害やGASコールドスタート時のFailed to fetch対策として最大3回自動リトライする。
     * 
     * @param {Object} payload - APIに送るデータオブジェクト（action名やデータ本体を含む）
     * @param {number} [maxRetries=3] - 最大リトライ回数
     * @param {number} [initialDelay=1200] - 初期リトライ待機ミリ秒
     * @return {Promise<Object>} APIから返却されたレスポンスオブジェクト
     */
    async function callGAS(payload, maxRetries = 3, initialDelay = 1200) {
      let lastError = null;
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000);

          const response = await fetch(GAS_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (!response.ok) {
            throw new Error("HTTPエラー (Status: " + response.status + ")");
          }
          const data = await response.json();
          return data;
        } catch (err) {
          lastError = err;
          console.warn(`[callGAS API試行 ${attempt}/${maxRetries} 失敗]:`, err);
          if (attempt < maxRetries) {
            const loaderP = document.querySelector('#loader p');
            if (loaderP) {
              loaderP.innerText = `通信接続中... 再試行しています (${attempt}/${maxRetries})`;
            }
            await new Promise(res => setTimeout(res, initialDelay * attempt));
          }
        }
      }

      if (lastError && (lastError.name === 'AbortError' || String(lastError.message).includes('fetch') || String(lastError.message).includes('NetworkError'))) {
        throw new Error("一時的な通信不良が発生しました。");
      }
      throw lastError || new Error("ネットワークエラーが発生しました");
    }

    const noOptionsList = [];
    for(let i = 800; i <= 830; i++) noOptionsList.push(String(i));
    for(let i = 900; i <= 930; i++) noOptionsList.push(String(i));
    for(let i = 1000; i <= 1030; i++) noOptionsList.push(String(i));
    
    async function initCheck() {
      const urlParams = new URLSearchParams(window.location.search);
      initialMode = urlParams.get('mode') || "entry";
      initialNo = urlParams.get('no') || "";
      
      let paramGate = urlParams.get('gate');
      if (!paramGate && initialNo) {
        paramGate = getGateFromNo(initialNo);
      }
      updateGateDisplay(paramGate || "800");

      if (initialMode === "exit" && initialNo) {
        window.currentNo = initialNo;
        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('loader').innerHTML = "<p>No." + initialNo + " を確認中...</p><div id='error-display'></div>";
        
        try {
          const result = await callGAS({ action: 'checkStatus', no: initialNo });
          handleQrScanResult(result);
        } catch (error) {
          handleError(error, () => initCheck());
        }
        return;
      }

      document.getElementById('loader').classList.add('hidden');
      if (initialMode === "exit") {
        showExitSearch();
      } else {
        showEntry();
      }
    }

    window.onload = async function() {
      const searchNoEl = document.getElementById('searchNo');
      if(searchNoEl) {
        searchNoEl.innerHTML = '<option value="" disabled selected>番号を選択</option>';
        noOptionsList.forEach(opt => {
          const option = document.createElement("option");
          option.value = opt;
          option.text = opt;
          searchNoEl.appendChild(option);
        });
      }

      try {
        await initCheck();
      } catch (e) {
        handleError(e, () => initCheck());
      }
    };

    /**
     * 画面上にエラーメッセージを表示する。
     * 
     * @param {string} msg - 表示するエラーメッセージ文字列（HTML可）
     */
    function showError(msg) {
      const errDiv = document.getElementById('error-display');
      if(errDiv) {
        errDiv.innerHTML = msg;
        errDiv.style.display = 'block';
      }
    }

    /**
     * 入構証No.の数値範囲に応じて、画面表示テキストの色（CSSクラス）を設定する。
     * ゲート番号ごとの識別カラーを表示して視認性を高めるために実装。
     * 
     * @param {string} noStr - 入構証番号文字列
     */
    function setNoColor(noStr) {
      const displayEl = document.getElementById('exitNoDisplay');
      displayEl.innerText = noStr;
      displayEl.className = "";
      
      const num = parseInt(noStr, 10);
      if (num >= 800 && num <= 830) {
        displayEl.classList.add("color-1");
      } else if (num >= 900 && num <= 930) {
        displayEl.classList.add("color-2");
      } else if (num >= 1000 && num <= 1030) {
        displayEl.classList.add("color-3");
      }
    }

    /**
     * QRスキャンまたは初期URL経由で取得した番号のステータス確認結果を処理する。
     * 構内に滞在中の場合は出構申請画面を表示し、未登録や出構済み、または既に「出構申請中」の場合は適切な案内メッセージを表示する。
     * 
     * @param {Object} result - checkStatus APIからの返却オブジェクト
     */
    function handleQrScanResult(result) {
      document.getElementById('loader').classList.add('hidden');
      const detectedGate = getGateFromNo(window.currentNo);
      if (detectedGate) {
        updateGateDisplay(detectedGate);
      }

      if (result.status === "INSIDE") {
        if (result.subStatus === "EXIT_PENDING") {
          showModal(
            "⚠️ 既に「出構申請中」です", 
            "No." + window.currentNo + " は既に「出構申請中」となっています。<br><br>現在、守衛室にて出構確認を行っています。<br>そのまま入構証を守衛所へご返却ください。", 
            () => showEntry(), 
            true
          );
        } else {
          setNoColor(window.currentNo);
          document.getElementById('exitSection').classList.remove('hidden');
        }
      } else if (result.status === "PENDING") {
        showModal("未受付", "No." + window.currentNo + " は入構証がまだ手交されていません（受付待ち）。", () => showEntry(), true);
      } else {
        showModal("エラー", "No." + window.currentNo + " が見つかりません。<br><span style='font-size:0.8em'>未受付または出構済みです。</span>", () => showEntry(), true);
      }
    }

    /**
     * 通信例外などのシステムエラーをアラート表示および画面表示する。
     * 再試行用コールバックが指定されている場合は「再試行」ボタン付きモーダルを表示する。
     * 
     * @param {Error} e - エラーオブジェクト
     * @param {Function} [retryCallback] - 再試行時に実行する関数
     */
    function handleError(e, retryCallback) {
      document.getElementById('loader').classList.add('hidden');
      const msgStr = String(e && e.message ? e.message : e);
      const isNetErr = msgStr.includes("fetch") || msgStr.includes("通信") || msgStr.includes("ネットワーク") || msgStr.includes("Failed");
      
      const title = isNetErr ? "⚠️ 通信エラー" : "エラー";
      const displayMsg = isNetErr
        ? "一時的なネットワーク不良または通信遅延が発生しました。<br><br>電波状況をご確認の上、<b>「再試行」</b>ボタンを押してください。"
        : "処理中にエラーが発生しました:<br>" + msgStr;

      if (retryCallback) {
        showRetryModal(title, displayMsg, retryCallback);
      } else {
        showModal(title, displayMsg, () => showEntry(), true);
      }
    }

    /**
     * 再試行ボタン付きのモーダルダイアログを表示する。
     */
    function showRetryModal(title, msg, retryCallback) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerHTML = msg;
      const confirmBtn = document.getElementById('modalConfirmBtn');
      const cancelBtn = document.querySelector('.btn-cancel');
      
      cancelBtn.style.display = "inline-block";
      cancelBtn.innerText = "キャンセル";
      cancelBtn.onclick = function() {
        closeModal();
        showEntry();
      };
      
      confirmBtn.innerText = "↻ 再試行";
      confirmBtn.style.width = "48%";
      confirmBtn.onclick = function() {
        closeModal();
        if (retryCallback) retryCallback();
      };
      
      document.getElementById('customModal').classList.add('active');
    }

    /**
     * 入構受付フォーム画面を表示し、他セクションを非表示にする。
     */
    function showEntry() {
      document.getElementById('exitSearchSection').classList.add('hidden');
      document.getElementById('exitSection').classList.add('hidden');
      document.getElementById('entrySection').classList.remove('hidden');
    }

    /**
     * 出構申請の番号選択画面を表示し、他セクションを非表示にする。
     */
    function showExitSearch() {
      document.getElementById('entrySection').classList.add('hidden');
      document.getElementById('exitSection').classList.add('hidden');
      document.getElementById('exitSearchSection').classList.remove('hidden');
    }

    /**
     * 手動で選択された入構証No.の滞在状態をWeb API経由でチェックする。
     * 存在チェックを行ってから出構申請確認画面へ遷移させるために実装。
     */
    async function manualSearch() {
      const inputNo = document.getElementById('searchNo').value;
      if(!inputNo) { 
        showModal("入力エラー", "番号を選択してください", () => closeModal(), true);
        return; 
      }
      window.currentNo = inputNo;
      document.getElementById('exitSearchSection').classList.add('hidden');
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('loader').innerHTML = '<p>No.' + inputNo + ' を確認中...</p><div id="error-display"></div>';
      
      try {
        const result = await callGAS({ action: 'checkStatus', no: inputNo });
        document.getElementById('loader').classList.add('hidden');
        if (result.status === "INSIDE") {
          if (result.subStatus === "EXIT_PENDING") {
            showModal(
              "⚠️ 既に「出構申請中」です", 
              "No." + window.currentNo + " は既に「出構申請中」となっています。<br><br>守衛室にて出構確認を行っていますので、入構証を守衛所へご返却ください。", 
              () => showExitSearch(), 
              true
            );
          } else {
            setNoColor(window.currentNo);
            document.getElementById('exitSection').classList.remove('hidden');
          }
        } else if (result.status === "PENDING") {
          showModal("未受付", "No." + window.currentNo + " は受付待ち状態（未手交）です。", () => showExitSearch(), true);
        } else {
          showModal("見つかりません", "該当データがありません。（未受付または出構済みです）", () => showExitSearch(), true);
        }
      } catch (error) {
        handleError(error, () => manualSearch());
      }
    }

    /**
     * 入構フォームに入力された代表者・同行者情報を取りまとめ、Web APIへ入構登録を送信する。
     * 動的に追加された同行者入力欄の値も収集してFormDataオブジェクトに統合するために実装。
     */
    async function submitEntry() {
      const form = document.getElementById('entryForm');
      
      if (!form.company.value || !form.name.value || !form.contact.value) {
        showModal("入力エラー", "会社名、氏名、面会先は必須です", () => closeModal(), true);
        return;
      }
      
      document.getElementById('entrySection').classList.add('hidden');
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('loader').innerHTML = '<p>登録中...</p><div id="error-display"></div>';
      
      const companionInputs = document.querySelectorAll('.companion-name');
      const companions = [];
      companionInputs.forEach(input => {
        const val = input.value.trim();
        if (val) {
          companions.push(val);
        }
      });

      const formData = { 
        gate: currentGate,
        no: "", 
        company: form.company.value, 
        name: form.name.value, 
        companions: companions,
        tel: form.tel.value, 
        purpose: form.purpose.value,
        contact: form.contact.value 
      };
      
      try {
        const result = await callGAS({ action: 'entry', formData: formData });
        document.getElementById('loader').classList.add('hidden');
        if (result.status === "SUCCESS") {
          document.getElementById('completeMsg').innerHTML = "受付しました。<br><strong>守衛室で入構証を受け取ってください。</strong>";
          document.getElementById('completeSection').classList.remove('hidden');
        } else {
          throw new Error(result.message || "登録処理に失敗しました");
        }
      } catch (error) {
        handleError(error, () => submitEntry());
      }
    }

    /**
     * 手元の入構証No.に対する出構申請処理をWeb APIへ送信する。
     * 出構前に送信確認モーダルを表示して誤操作を回避するために実装。
     */
    function submitExit() {
      showModal("出構申請", `No.${window.currentNo} の出構申請を<br>送信しますか？`, function() {
        executeExitSubmit();
      });
    }

    async function executeExitSubmit() {
      document.getElementById('exitSection').classList.add('hidden');
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('loader').innerHTML = '<p>No.' + window.currentNo + ' の出構申請を送信中...</p><div id="error-display"></div>';
      
      try {
        const result = await callGAS({ action: 'exit', no: window.currentNo });
        document.getElementById('loader').classList.add('hidden');
        if (result.status === "SUCCESS") {
          document.getElementById('completeMsg').innerText = "出構申請を完了しました。";
          document.getElementById('completeSection').classList.remove('hidden');
        } else if (result.status === "ALREADY_EXIT_PENDING") {
          showModal(
            "⚠️ 既に出構申請されています", 
            result.message || ("No." + window.currentNo + " は既に「出構申請中」となっています。<br><br>守衛室にて確認中ですので、入構証を守衛所へご返却ください。"), 
            () => {
              document.getElementById('completeMsg').innerText = "既に「出構申請中」です。守衛室へ入構証をご返却ください。";
              document.getElementById('completeSection').classList.remove('hidden');
            }, 
            true
          );
        } else {
          throw new Error(result.message || "出構処理に失敗しました");
        }
      } catch (error) {
        handleError(error, () => executeExitSubmit());
      }
    }

    /**
     * カスタム確認ダイアログを表示する。
     * エラーダイアログの場合はボタンを「OK」1つだけにして表示する。
     * 
     * @param {string} title - モーダルのタイトル文字列
     * @param {string} msg - モーダル本文（HTML可）
     * @param {Function} [onConfirm] - 実行ボタン押下時のコールバック関数
     * @param {boolean} [isError=false] - エラー表示フラグ（OKボタンのみ表示）
     */
    function showModal(title, msg, onConfirm, isError = false) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerHTML = msg;
      const confirmBtn = document.getElementById('modalConfirmBtn');
      const cancelBtn = document.querySelector('.btn-cancel');
      
      if (isError || title.includes("エラー") || title.includes("見つかりません")) {
        cancelBtn.style.display = "none";
        confirmBtn.innerText = "OK";
        confirmBtn.style.width = "100%";
      } else {
        cancelBtn.style.display = "inline-block";
        confirmBtn.innerText = "実行";
        confirmBtn.style.width = "48%";
      }
      
      confirmBtn.onclick = function() { closeModal(); if (onConfirm) onConfirm(); };
      document.getElementById('customModal').classList.add('active');
    }

    /**
     * カスタム確認ダイアログモーダルを閉じる。
     */
    function closeModal() { document.getElementById('customModal').classList.remove('active'); }

    /**
     * 同行者の氏名を入力するためのテキスト入力欄を行単位で動的に追加する。
     * 同行者の人数制限を設けず可変で入力可能にするために実装。
     */
    function addCompanionInput() {
      const container = document.getElementById('companionList');
      const row = document.createElement('div');
      row.className = 'companion-row';
      row.innerHTML = `
        <input type="text" class="companion-name" placeholder="同行者氏名を入力" required>
        <button type="button" class="btn-remove-companion" onclick="removeCompanionInput(this)">削除</button>
      `;
      container.appendChild(row);
    }

    /**
     * 指定された同行者入力欄の行要素を削除する。
     * 
     * @param {HTMLButtonElement} btn - 押下された削除ボタン要素
     */
    function removeCompanionInput(btn) {
      btn.parentElement.remove();
    }
  </script>
</body>
</html>
